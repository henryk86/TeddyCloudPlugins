<!doctype html>
<!-- teddybridge as an entry in TeddyCloud's Plugins tab.
     Copy the folder "teddybridge" to <teddycloud-data>/www/plugins/.
     The address of teddybridge is asked for on first use and stored in the browser
     (change it later by opening this page with ?setup).
     Optionally preset it: replace TEDDYBRIDGE_URL (one occurrence, in the script) with the address,
     e.g. https://teddybridge.example.lan/ - see README.md.
     teddybridge is shown inside TeddyCloud if it allows it (FRAME_ANCESTORS), otherwise the window is redirected. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teddybridge</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f6f4;--fg:#222;--muted:#666;--acc:#2f6fdf;--line:#ccc}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1c1e;--fg:#eee;--muted:#aaa;--acc:#6b9bff;--line:#444}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:32em;width:100%;text-align:center}
  .btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;border:0;font:inherit;cursor:pointer}
  .link{background:none;border:0;color:var(--acc);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit;margin:8px 0}
  small,.hint{color:var(--muted)}
  .err{color:#d33}
  [hidden]{display:none!important}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<iframe id="frame" title="teddybridge" hidden></iframe>
<main>
  <section id="open" hidden>
    <p id="msg"></p>
    <p><a class="btn" id="go" target="_top"></a></p>
    <p><small><span id="fallback"></span> <a id="tab" target="_blank" rel="noopener"></a></small></p>
    <p><button class="link" id="change"></button></p>
  </section>
  <form id="setup" hidden>
    <p><strong id="setupTitle"></strong></p>
    <p class="hint" id="setupHint"></p>
    <input id="url" type="url" required placeholder="https://teddybridge.example.lan/" autocomplete="url">
    <p class="err" id="err" hidden></p>
    <p><button class="btn" id="save" type="submit"></button></p>
  </form>
</main>
<script>
  // Preset address (optional). Leave as is to ask on first use.
  const PRESET = 'TEDDYBRIDGE_URL';
  const KEY = 'teddybridge.url';
  const DELAY = 1500; // ms before redirecting, so "change address" can still be clicked
  const GRACE = 800;  // ms after the frame loaded to wait for teddybridge's "ready" message
  const MAXWAIT = 10000; // ms until giving up on the frame (address unreachable)

  // Language of TeddyCloud, so that teddybridge and these texts match it: web v2 sets <html lang>, web v1 keeps
  // the choice in localStorage (i18next, with a per-user prefix when TeddyCloud has a login). Fallback: browser.
  function tcLang() {
    try {
      const fe = window.frameElement;
      if (fe && fe.classList.contains('plugin-frame')) return parent.document.documentElement.lang || null;
      const keys = Object.keys(localStorage).filter(k => k === 'i18nextLng' || /^user:.*:i18nextLng$/.test(k));
      const vals = [...new Set(keys.map(k => localStorage.getItem(k)))];
      return vals.length === 1 ? vals[0] : localStorage.getItem('i18nextLng');
    } catch (e) { return null; }
  }
  const LANG = (/^(de|en)/i.exec(tcLang() || navigator.language || '') || [])[1];
  const de = (LANG || '').toLowerCase() === 'de';
  const L = de ? {
    opening: 'teddybridge öffnet sich …', open: 'teddybridge öffnen', fallback: 'Falls nichts passiert:',
    tab: 'in neuem Tab öffnen', change: 'Adresse ändern', setupTitle: 'Adresse von teddybridge',
    setupHint: 'Unter welcher Adresse erreicht dieser Browser teddybridge? Sie wird nur in diesem Browser gespeichert.',
    save: 'Speichern und öffnen', bad: 'Bitte eine Adresse mit http:// oder https:// eingeben.'
  } : {
    opening: 'Opening teddybridge …', open: 'Open teddybridge', fallback: 'If nothing happens:',
    tab: 'open in a new tab', change: 'Change address', setupTitle: 'Address of teddybridge',
    setupHint: 'At which address does this browser reach teddybridge? It is stored in this browser only.',
    save: 'Save and open', bad: 'Please enter an address starting with http:// or https://.'
  };
  document.documentElement.lang = de ? 'de' : 'en';
  const $ = id => document.getElementById(id);
  for (const [id, key] of [['go','open'],['fallback','fallback'],['tab','tab'],['change','change'],
                           ['setupTitle','setupTitle'],['setupHint','setupHint'],['save','save']]) $(id).textContent = L[key];

  function valid(u) {
    try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : null; }
    catch (e) { return null; }
  }
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function store(u) { try { localStorage.setItem(KEY, u); } catch (e) { /* private mode: use once */ } }

  let timer = null, waiting = null, stopEmbed = null;
  // Try to show teddybridge inside TeddyCloud. teddybridge reports "ready" via postMessage when it may be
  // framed (FRAME_ANCESTORS); a blocked frame loads an error page without that message -> redirect instead.
  function embed(url) {
    const frame = $('frame'), origin = new URL(url).origin;
    let ok = false;
    $('setup').hidden = true; $('open').hidden = false;
    $('msg').textContent = L.opening;
    $('go').href = url; $('tab').href = url;
    const fallback = () => { if (!ok && waiting) { cleanup(); frame.removeAttribute('src'); open(url); } };
    const onMsg = ev => {
      if (ev.source === frame.contentWindow && ev.origin === origin && ev.data && ev.data.teddybridge === 'ready') {
        ok = true; cleanup(); frame.hidden = false; $('open').hidden = true; fit();
        theme = null; syncTheme(frame, origin);
        if (!syncTheme.on) { syncTheme.on = setInterval(() => syncTheme(frame, origin), 1500); }
      }
    };
    const onLoad = () => setTimeout(fallback, GRACE);
    function cleanup() {
      clearTimeout(waiting); waiting = null;
      window.removeEventListener('message', onMsg); frame.removeEventListener('load', onLoad);
    }
    stopEmbed = cleanup;
    window.addEventListener('message', onMsg);
    frame.addEventListener('load', onLoad);
    waiting = setTimeout(fallback, MAXWAIT);
    const t = tcTheme();
    const u = new URL(url);
    if (LANG) u.searchParams.set('lang', LANG.toLowerCase());
    if (t) u.hash = 'theme=' + t;
    frame.src = u.href;
  }
  // Fill the visible height below the frame's top edge. TeddyCloud web v1 sizes the plugin frame to its content
  // (so the body gets the height); web v2 (class "plugin-frame") gives the frame a fixed height and shows a fixed
  // tab bar at the bottom on phones (so the frame itself gets the height, minus the tab bar).
  function fit() {
    try {
      const fe = window.frameElement;
      if (!fe) return;
      const pw = parent, vh = pw.visualViewport ? pw.visualViewport.height : pw.innerHeight;
      const top = fe.getBoundingClientRect().top + pw.scrollY;
      const v2 = fe.classList.contains('plugin-frame');
      let bottom = 24;
      if (v2) {
        bottom = 8;
        const tb = pw.document.querySelector('.tabbar');
        if (tb && pw.getComputedStyle(tb).display !== 'none') bottom += tb.getBoundingClientRect().height;
      }
      const h = Math.max(360, Math.floor(vh - top - bottom));
      document.body.style.minHeight = '0';
      document.body.style.height = h + 'px';
      if (v2) fe.style.height = h + 'px';
      if (!fit.on) {
        fit.on = true;
        pw.addEventListener('resize', fit);
        if (pw.visualViewport) pw.visualViewport.addEventListener('resize', fit);
      }
    } catch (e) { /* not same-origin: keep 100vh */ }
  }
  // Follow TeddyCloud's light/dark theme: the first non-transparent background around the plugin frame decides.
  function tcTheme() {
    try {
      for (let e = window.frameElement; e; e = e.parentElement) {
        const m = (parent.getComputedStyle(e).backgroundColor.match(/[\d.]+/g) || []).map(Number);
        if (m.length < 3 || m[3] === 0) continue;
        return 0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2] < 128 ? 'dark' : 'light';
      }
    } catch (e) { /* not same-origin */ }
    return null;
  }
  let theme = null;
  function syncTheme(frame, origin) {
    const t = tcTheme();
    if (t && t !== theme) {
      theme = t;
      document.documentElement.style.colorScheme = t;
      try { frame.contentWindow.postMessage({teddybridge: 'theme', theme: t}, origin); } catch (e) { /* egal */ }
    }
  }
  function open(url) {
    $('setup').hidden = true; $('open').hidden = false;
    $('msg').textContent = L.opening;
    $('go').href = url; $('tab').href = url;
    // Framing not allowed (FRAME_ANCESTORS not set in teddybridge): redirect the whole window instead.
    // Some browsers only allow that after a click - then the button stays.
    timer = setTimeout(() => { try { (window.top || window).location.href = url; } catch (e) { /* use the button */ } }, DELAY);
  }
  function setup(current) {
    clearTimeout(timer);
    if (stopEmbed) stopEmbed();
    $('frame').hidden = true; $('frame').removeAttribute('src');
    $('open').hidden = true; $('setup').hidden = false;
    $('url').value = current || '';
    $('url').focus();
  }

  $('change').onclick = () => setup($('go').href);
  $('setup').onsubmit = ev => {
    ev.preventDefault();
    const u = valid($('url').value.trim());
    $('err').hidden = !!u; $('err').textContent = L.bad;
    if (u) { store(u); embed(u); }
  };

  const url = valid(stored()) || valid(PRESET);
  (url && !/[?&]setup\b/.test(location.search)) ? embed(url) : setup(url || '');
</script>
</body>
</html>
